# release.yml — the v-tag release pipeline.
#
# Triggered by pushing a version tag (v1.0.0, v1.0.1, ...). Runs the
# full packaging matrix with upload, produces the pristine source
# archive from the exact tagged revision, and creates a DRAFT GitHub
# Release with every validated artifact + SHA256SUMS + generated
# notes. The draft is reviewed and published by a human — nothing
# goes public automatically.
#
# Authorization model: every job except the final release step runs
# with contents: read. The release job gets contents: write for the
# ephemeral GITHUB_TOKEN only (creating the draft + uploading assets)
# — no fine-grained PAT, no personal credentials, nothing reusable.
# Required packaging targets (debian / rpm / arch / source) must all
# pass or the release job is skipped entirely; optional targets
# (alpine / void) that fail are simply absent from the artifacts, and
# the generated notes state that honestly.
#
# Build-from-exact-tag: the tag is what triggered this workflow and
# every checkout below checks out the tag's commit by default.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  packages:
    name: distro packages
    uses: ./.github/workflows/distro-packages.yml
    with:
      upload: true
    permissions:
      contents: read

  source-archive:
    name: source archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (the exact tagged revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the pristine source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz \
            -o "dist/fdk-${VERSION}.tar.gz" \
            --prefix="fdk-${VERSION}/" \
            "$GITHUB_REF_NAME"
          sha256sum "dist/fdk-${VERSION}.tar.gz"
          tar -tzf "dist/fdk-${VERSION}.tar.gz" | head -5

      - name: Upload source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: src-archive
          path: dist/
          if-no-files-found: error

  release:
    name: draft release
    needs: [packages, source-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for the notes generator and packaging scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and release notes
        run: |
          sh packaging/ci/release-notes.sh "$GITHUB_REF_NAME" dist
          ls -la dist/

      - name: Create the draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          assets=""
          for f in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst \
                   dist/*.apk dist/*.xbps dist/fdk-*.tar.gz; do
            [ -f "$f" ] && assets="$assets $f"
          done
          if [ -z "$assets" ]; then
            echo "RELEASE FAIL: no package artifacts were produced — refusing to create an empty release"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "FDK v${VERSION}" \
            --notes-file notes.md \
            $assets dist/SHA256SUMS
          echo "Draft release created — review and publish from the Releases page."
