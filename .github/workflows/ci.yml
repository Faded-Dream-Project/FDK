# ci.yml — validation builds for pushes to main and release, and
# pull requests.
#
# Two jobs:
#   build-test       — the project's home-ground full battery on an
#                      ubuntu runner (both backends compiled, both
#                      test suites, release + examples, export check)
#   distro-packages  — the full cross-distribution packaging matrix
#                      (debian/rpm/arch/alpine/void, build + clean
#                      install-tests inside pinned containers)
#
# No secrets are used anywhere in this workflow: everything runs on
# the ephemeral GITHUB_TOKEN with contents: read. Pull requests from
# forks therefore run with a read-only token — untrusted PR code
# executes only inside ephemeral, throwaway runner VMs and containers
# with nothing write-enabled to reach.
#
# No caching is configured on purpose: every run builds from a clean
# tree so a green check always means "this exact source builds and
# passes", never "some cached earlier state did".

name: ci

on:
  push:
    # main is the development branch (unstable by design); release is
    # the consumer-facing fast-forward pointer (docs/RELEASING.md) -
    # both are validated identically so a consumer who pins the
    # branch always sees green on exactly what they built.
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # libxtst-dev: fdk-shell's X11 suite synthesizes Super+number
          # keys through the XTEST extension (the passive-grab
          # passthrough test) — test infrastructure, the same class
          # as libx11-dev (nothing in the package chain ships it).
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxtst-dev libxi-dev zlib1g-dev \
            libwayland-dev libxkbcommon-dev \
            dbus libglib2.0-bin \
            libgl1 xvfb fonts-dejavu-core python3-pil

      - name: Build (debug, sanitizers)
        run: make

      - name: Headless test suite
        run: make test

      - name: X11 integration suite (throwaway Xvfb)
        run: make test-x11

      - name: Native D-Bus client — live bus (dbus-run-session + Xvfb)
        # The hand-rolled client against a REAL throwaway dbus-daemon:
        # SASL+Hello, method calls through the daemon, errors, match
        # rules/signals, properties, name watching, introspection,
        # timeouts, close-from-callback reentrancy. REQUIRED here —
        # the container has dbus, so a skip would be a regression.
        run: FDK_DBUS_TEST_REQUIRE=1 make test-dbus

      - name: Wayland integration suite (self-skips without a compositor)
        run: make test-wayland

      - name: Release build + examples + export surface
        # One invocation, one config: `make release` followed by plain
        # `make examples` would silently flip the config stamp back to
        # debug (sanitizer builds). FDK_CONFIG pinned throughout.
        run: make FDK_CONFIG=release all examples verify-exports

      - name: fdk-shell (the first add-on package) — build + X11 suite
        # The add-on builds against the sibling checkout here; the
        # ISOLATION proof (installed-prefix build, the no-internals
        # boundary) is its own step below — the same proof the distro
        # packaging jobs re-run against the dpkg/rpm/pacman/apk/xbps
        # INSTALLED FDK inside their containers.
        run: |
          make -C fdk-shell clean
          make -C fdk-shell static shared examples
          make -C fdk-shell test-x11

      - name: fdk-shell — the prefix-isolation proof
        # THE add-on contract: FDK installed into a throwaway prefix,
        # fdk-shell rebuilt against that prefix ALONE (no sibling-tree
        # include path), the demo linked + run from the installed
        # stack, and the dynamic boundary asserted (fdk_* imports all
        # resolve from libfdk.so.1; exports are fdk_shell_* only).
        run: make -C fdk-shell isolation

      - name: fdk-shell — Wayland suite (self-skips without a compositor)
        run: make -C fdk-shell test-wayland

      - name: fdk-shell — notifyd rig (the notification daemon, end to end)
        # S-2/A-12: the org.freedesktop.Notifications server on the
        # native D-Bus client, proven against a REAL throwaway
        # dbus-daemon — dbus-send (libdbus) and gdbus (GLib) as
        # cross-implementation callers, gdbus monitor as the signal
        # receiver; hostile-input and rate-limit batteries; the
        # bus-name etiquette matrix; X11 pixel + XTEST-click + EWMH
        # legs under Xvfb. (The Wayland layer-shell legs self-skip on
        # runners without sway — the sandbox and TESTING-ON-DESKTOP
        # cover them.) libxi-dev/libglib2.0-bin above are this step's
        # test infrastructure, the same class as libxtst-dev.
        run: NOTIFYD_RIG_REQUIRE=1 make -C fdk-shell test-notifyd

  distro-packages:
    name: distro packages
    uses: ./.github/workflows/distro-packages.yml
    permissions:
      contents: read
