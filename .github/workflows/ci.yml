# ci.yml — validation builds for pushes to main, and pull
# requests.
#
# Two jobs:
#   build-test       — the project's home-ground full battery on an
#                      ubuntu runner (both backends compiled, both
#                      test suites, optimized -O2 build + examples,
#                      export check)
#   distro-packages  — the full cross-distribution packaging matrix
#                      (debian/rpm/arch/alpine/void, build + clean
#                      install-tests inside pinned containers) — kept
#                      as a CI check that the packaging recipes stay
#                      buildable, not as a release channel
#
# No secrets are used anywhere in this workflow: everything runs on
# the ephemeral GITHUB_TOKEN with contents: read. Pull requests from
# forks therefore run with a read-only token — untrusted PR code
# executes only inside ephemeral, throwaway runner VMs and containers
# with nothing write-enabled to reach.
#
# No caching is configured on purpose: every run builds from a clean
# tree so a green check always means "this exact source builds and
# passes", never "some cached earlier state did".

name: ci

on:
  push:
    # main is the development branch — the only branch, and the one
    # to build from; every push is validated identically.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # a dead runner fails fast (the arch hang, 2026-11-10)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # libxtst-dev: the X11 integration rigs synthesize Super+number
          # keys through the XTEST extension (the passive-grab
          # passthrough test) — test infrastructure, the same class
          # as libx11-dev (nothing in the package chain ships it).
          # libxrandr-dev: a REAL build dependency since M-6 — the
          # core's RandR output model links libXrandr directly (the
          # packaging metadata in all five families declares it; this
          # line is the runner-side twin, missed when M-6 landed).
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxext-dev libxtst-dev libxi-dev zlib1g-dev \
            libwayland-dev libxkbcommon-dev \
            dbus libglib2.0-bin \
            libgl1 xvfb fonts-dejavu-core python3-pil \
            libharfbuzz0b libfribidi0 fonts-wqy-zenhei fonts-urw-base35 \
            libxrandr-dev \
            fonts-noto-core
          # fonts-noto-core: the per-script faces (Arabic, Devanagari,
          # Hebrew, Thai, Bengali, ...) that the shaping suite's
          # six-script fallback matrix and the text_demo screenshot
          # rig assert against — the §10 desktop report's root cause
          # (an unsorted script table) was invisible to tests whose
          # machines only had the one CJK font; the matrix now demands
          # real per-script answers.
          # The default sans-serif stays DejaVu Sans: fonts-noto-core
          # would otherwise win fontconfig's default ranking and shift
          # every text-metric-dependent layout the GUI geometry tests
          # are calibrated against (the color-chooser OK-button click
          # is the known case). The per-script faces serve the FALLBACK
          # channel, which is queried by language, not by the default
          # family — the pin does not touch it.
          sudo tee /etc/fonts/local.conf > /dev/null <<'XMLCONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test qual="any" name="family"><string>sans-serif</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
            </match>
          </fontconfig>
          XMLCONF

      - name: Build (debug, sanitizers)
        run: make

      - name: Headless test suite
        run: make test

      - name: Text shaping — the legacy posture (FDK_SHAPING=0)
        run: FDK_SHAPING=0 ./build/tests/test_shaping

      - name: text_demo screenshot rig (§10 hand-equivalent, Xvfb)
        # The owner's desktop check (TESTING-ON-DESKTOP §10) made
        # mechanical: joined Arabic, the Devanagari shirorekha, dense
        # Han ideographs, each verified shaped-vs-legacy under Xvfb
        # with a negative control. The per-script Noto faces are
        # installed above so every leg RUNS here (a skip would be a
        # regression on this runner).
        run: make test-textdemo

      - name: X11 integration suite (throwaway Xvfb)
        run: make test-x11

      - name: Native D-Bus client — live bus (dbus-run-session + Xvfb)
        # The hand-rolled client against a REAL throwaway dbus-daemon:
        # SASL+Hello, method calls through the daemon, errors, match
        # rules/signals, properties, name watching, introspection,
        # timeouts, close-from-callback reentrancy. REQUIRED here —
        # the container has dbus, so a skip would be a regression.
        run: FDK_DBUS_TEST_REQUIRE=1 make test-dbus

      - name: Wayland integration suite (self-skips without a compositor)
        run: make test-wayland

      # P3: the protocol surface (X11 lane: the honest negatives; the
      # add-on texture exchange; present arbitration) — each target
      # owns its Xvfb.
      - name: P3 protocol tests (Xvfb)
        run: |
          make test-x11-share
          make test-arbitration
          make test-p3-x11
          make test-matrix-x11

      # P4: the dma-buf import. The validation matrix runs everywhere;
      # the REAL round-trip (a GBM buffer through the texture path)
      # self-reports SKIP on these runners: they expose no
      # /dev/dri (no GPU passthrough, no udmabuf, no dma-heaps).
      # A runner that would run it for real: a SELF-HOSTED runner on
      # a machine with a DRM render node (/dev/dri/renderD*) and
      # libgbm1 — then the round-trip allocates a real linear buffer
      # and verifies the imported pixels.
      - name: P4 dma-buf import (round-trip SKIPs without /dev/dri)
        run: make test-dmabuf

      # The installed tree: public headers only, no internal include
      # paths (the examples compile against PREFIX alone).
      - name: make install + the protocol examples against the installed tree
        run: make test-examples-protocols

      # The second blind example (09_gl_dmabuf_panel.c): worker ->
      # fdk_post -> the dma-buf import attempt -> the caption draw, on
      # the installed tree under Xvfb. Zero-copy needs a DRM box (the
      # drm-soak job); on Xvfb the documented UNSUPPORTED refusal IS
      # the pass, and the example exits 0 saying so.
      - name: The GL dmabuf panel example (Xvfb)
        run: |
          P=$PWD/build/fdk-install
          cc -Iinclude examples/09_gl_dmabuf_panel.c $P/lib/libfdk.a \
            -fsanitize=address,undefined \
            -lX11 -lXext -lXrandr -lXrender -ldl -lwayland-client \
            -lxkbcommon -lm -lz -pthread -o build/panel_example
          xvfb-run -a -s "-screen 0 800x600x24" \
            ./build/panel_example

      # The headless sway rig: the real compositor for the Wayland
      # protocol legs (wlroots headless backend, pixman renderer).
      - name: Install sway
        run: sudo apt-get install -y --no-install-recommends sway
      - name: P3 protocol tests (headless sway)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          # wlroots' headless backend: no DRM node, no tty, no libseat
          export WLR_BACKENDS=headless
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER=pixman
          sway -c /dev/null & SWAY_PID=$!
          for i in $(seq 1 20); do
            ls "$XDG_RUNTIME_DIR" | grep -q '^wayland-' && break
            sleep 0.5
          done
          # Leak detection fully ON on BOTH lanes — no blanket
          # detect_leaks=0, and NO runtime suppression file: the
          # investigation (2026-11-11) closed the question —
          #   gcc-14's libasan parser rejects the valid file
          #   non-deterministically (a fatal abort on some binaries,
          #   a non-fatal warning on others),
          #   Ubuntu's clang runtime has NO leak suppression type at
          #   all (its "Supported suppression types" list names only
          #   interceptor_*/odr_violation — LSan is compiled out of
          #   the packaged clang_rt.asan),
          # so a suppression file is unconsumable on the distro
          # runtimes and the suite relies on the actual fixes (it is
          # leak-clean under plain detection on both lanes).
          # Lane 2 (clang) stays as a second, independent detector —
          # its first build caught a GCC-only nested function clang
          # rightly rejects.
          WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep -o 'wayland-[0-9]*' | head -1) \
            make test-p3-wayland test-matrix-wayland
          make clean
          make CC=clang -j4 build/tests/test_p3_protocols build/tests/test_matrix
          WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep -o 'wayland-[0-9]*' | head -1) \
            ASAN_OPTIONS=detect_leaks=1 \
            ./build/tests/test_p3_protocols wayland
          WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep -o 'wayland-[0-9]*' | head -1) \
            ASAN_OPTIONS=detect_leaks=1 \
            ./build/tests/test_matrix wayland
          kill $SWAY_PID 2>/dev/null || true

      - name: Optimized build (-O2) + examples + export surface
        # One invocation, one config: an optimized-config build followed
        # by plain `make examples` would silently flip the config stamp
        # back to debug (sanitizer builds). FDK_CONFIG pinned throughout.
        run: make FDK_CONFIG=release all examples verify-exports

  distro-packages:
    name: distro packages
    uses: ./.github/workflows/distro-packages.yml
    permissions:
      contents: read

  # The DRM-equipped soak (non-blocking): the dmabuf round-trip and the
  # modifier query need a real render node. Stock runners have none, so
  # this job is a TEMPLATE for a self-hosted runner — enable it by
  # giving the runner the `drm` label and the setup below.
  #
  # SETUP NOTES (self-hosted, one-time):
  #   - a machine with /dev/dri/renderD128 (any modern amdgpu/i915/nouveau,
  #     or vgem/vkms for software), udev access for the runner user
  #     (`sudo usermod -aG render <user>`; re-login),
  #   - packages: libgbm1 libdrm2 libegl1 mesa-utils (the distro's mesalib),
  #   - the runner needs no display: the GBM round-trip uses the render
  #     node directly (no compositor, no seat, no tty),
  #   - verify once by hand: ls -l /dev/dri/renderD* && ./build/tests/test_dmabuf
  #     (the SKIP lines must disappear; every other check keeps its verdict).
  drm-soak:
    name: dmabuf round-trip (DRM runner)
    # Never pending on a normal push: the job SKIPS unless the repo
    # variable HAS_DRM_RUNNER is literally 'true' (Settings -> Secrets
    # and variables -> Actions -> Variables). That is the one switch —
    # flip it when the self-hosted runner with the `drm` label is
    # actually registered, not before (a queued job on a missing label
    # holds the whole run in progress forever, which is exactly what
    # happened on 2026-11-10/11). Fork pull requests can never reach
    # it either: a self-hosted runner must not execute forked code.
    if: ${{ vars.HAS_DRM_RUNNER == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) }}
    runs-on: [self-hosted, drm]
    timeout-minutes: 25 # a dead runner fails fast (the arch hang, 2026-11-10)
    continue-on-error: true # non-blocking by design: the soak REPORTS, it
                            # does not gate (the sandbox/stock runners SKIP)
    steps:
      - uses: actions/checkout@v4
      - name: Render node present?
        run: |
          test -c /dev/dri/renderD128 || {
            echo "SKIP: no render node on this runner"; exit 0; }
      - name: Build + the dmabuf suite
        run: |
          make build/tests/test_dmabuf
          ./build/tests/test_dmabuf
